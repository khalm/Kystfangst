<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kystfangst v0.1.0</title>

  <!-- PWA Manifest & Farger -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#121826" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦀</text></svg>" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #map { height: 100%; width: 100%; }

    .top-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(18, 24, 38, 0.94);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-shadow: 0 4px 16px rgba(0,0,0,0.45);
    }
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .title-group {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .top-header h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
    .version-tag {
      font-size: 10px;
      font-weight: 500;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 5px;
      border-radius: 4px;
    }
    
    .controls { display: flex; gap: 8px; align-items: center; font-size: 13px; flex-wrap: wrap; }
    
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:active { background: #1d4ed8; }

    #installBtn {
      display: none;
      background: #16a34a;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    #installBtn:active { background: #15803d; }

    .legend-box {
      position: absolute;
      bottom: 20px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(18, 24, 38, 0.94);
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 10px;
      font-family: sans-serif;
      font-size: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-header">
      <div class="title-group">
        <h1>Kystfangst</h1>
        <span class="version-tag">v0.1.0</span>
      </div>
      <button id="installBtn" onclick="installerPwa()">Installer app</button>
    </div>
    <div class="controls">
      <button class="btn" id="locateBtn" onclick="finnMinPosisjon()">Min posisjon</button>
      <label><input type="checkbox" id="toggleSediment" checked onchange="toggleLag()"> Bunn</label>
      <label><input type="checkbox" id="toggleFredet" checked onchange="toggleLag()"> Fredning</label>
    </div>
  </div>

  <div class="legend-box" id="infoBox">
    Trykk i kartet for å sette 5-meters kastesirkel og lese av dybdekurver.
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ----------------------------------------------------------------
    // 1. Service Worker & Oppdatering
    // ----------------------------------------------------------------
    let refreshing = false;
    navigator.serviceWorker?.addEventListener('controllerchange', () => {
      if (!refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          reg.update();
        }).catch((err) => {
          console.warn('SW-registrering feilet:', err);
        });
      });
    }

    // ----------------------------------------------------------------
    // 2. Installer-knapp logikk
    // ----------------------------------------------------------------
    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'inline-block';
    });

    function installerPwa() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          installBtn.style.display = 'none';
        }
        deferredPrompt = null;
      });
    }

    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
      deferredPrompt = null;
    });

    // ----------------------------------------------------------------
    // 3. Kart & Lag (Web Mercator / åpne kilder)
    // ----------------------------------------------------------------
    const map = L.map('map', { 
      zoomControl: false,
      maxZoom: 18,
      minZoom: 5
    }).setView([62.37, 6.0], 13);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Kystkontur og terreng
    const topoBase = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution: '© Esri, Kartverket',
      maxZoom: 18
    }).addTo(map);

    // Fyrlykter, sjømerker og grunner
    const sjomerker = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {
      attribution: '© OpenSeaMap',
      maxZoom: 18
    }).addTo(map);

    // Kartverkets sjøkartraster
    const sjokartRaster = L.tileLayer.wms('https://opencache.statkart.no/gatekeeper/gk/gk.open?', {
      layers: 'sjokartraster',
      format: 'image/png',
      transparent: true,
      opacity: 0.85,
      attribution: '© Kartverket'
    }).addTo(map);

    // NGU Bunnsedimenter
    const bunnlag = L.tileLayer.wms('https://geo.ngu.no/geoserver/marin_sedimentkornstorrelse/wms?', {
      layers: 'Sedimentkornstorrelse_omrade',
      format: 'image/png',
      transparent: true,
      opacity: 0.5,
      attribution: '© NGU'
    }).addTo(map);

    // Fiskeridirektoratets hummerfredningsområder
    const fredningslag = L.tileLayer.wms('https://kart.fiskeridir.no/wms.aspx?', {
      layers: 'hummerreservat',
      format: 'image/png',
      transparent: true,
      opacity: 0.65,
      attribution: '© Fiskeridirektoratet'
    }).addTo(map);

    // ----------------------------------------------------------------
    // 4. Kasteposisjon og sirkel
    // ----------------------------------------------------------------
    let kasteSirkel = null;
    let klikkMarkor = null;

    map.on('click', function(e) {
      markerKastesone(e.latlng, "Valgt kasteplass");
    });

    function markerKastesone(latlng, tekst) {
      if (kasteSirkel) map.removeLayer(kasteSirkel);
      if (klikkMarkor) map.removeLayer(klikkMarkor);

      klikkMarkor = L.marker(latlng).addTo(map);

      // 5-meters kastesirkel
      kasteSirkel = L.circle(latlng, {
        radius: 5,
        color: '#ef4444',
        fillColor: '#ef4444',
        fillOpacity: 0.35,
        weight: 2
      }).addTo(map);

      document.getElementById('infoBox').innerHTML = 
        `<strong>${tekst}</strong><br>` +
        `Rød ring = 5 m rekkevidde.<br>` +
        `Treffer ringen 5m/10m-koter ved kanten?`;
    }

    function finnMinPosisjon() {
      if (!navigator.geolocation) {
        alert("Geolokasjon støttes ikke av nettleseren.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const latlng = [pos.coords.latitude, pos.coords.longitude];
          map.setView(latlng, 17);
          markerKastesone(latlng, "Din GPS-posisjon");
        },
        (err) => alert("Kunne ikke hente posisjon: " + err.message),
        { enableHighAccuracy: true }
      );
    }

    function toggleLag() {
      const showSediment = document.getElementById('toggleSediment').checked;
      const showFredet = document.getElementById('toggleFredet').checked;

      if (showSediment) map.addLayer(bunnlag); else map.removeLayer(bunnlag);
      if (showFredet) map.addLayer(fredningslag); else map.removeLayer(fredningslag);
    }
  </script>
</body>
</html>
