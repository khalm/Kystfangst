<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kystfangst v1.2.0</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#121826" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦀</text></svg>" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #map { height: 100%; width: 100%; }

    body {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .top-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(18, 24, 38, 0.95);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 12px 14px;
      border-radius: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .title-group { display: flex; align-items: baseline; gap: 6px; }
    .top-header h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
    .version-tag {
      font-size: 10px;
      font-weight: 600;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
    }

    #installBtn {
      display: none;
      background: #16a34a;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .selectors-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }
    .select-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .select-item label {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 600;
      color: #94a3b8;
    }
    select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      width: 100%;
    }

    .stepper-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 2px 6px;
      height: 31px;
    }
    .step-btn {
      background: #334155;
      color: #fff;
      border: none;
      width: 26px;
      height: 24px;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .step-btn:active { background: #475569; }
    .step-val {
      font-size: 12px;
      font-weight: 700;
      color: #38bdf8;
    }

    .action-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 6px;
    }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      text-align: center;
    }
    .btn:active { background: #1d4ed8; }
    .btn-secondary { background: #334155; }

    .btn-nav {
      background: #0284c7;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }
    .btn-copy {
      background: #334155;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .info-panel {
      position: absolute;
      bottom: 20px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(18, 24, 38, 0.95);
      backdrop-filter: blur(8px);
      color: #e2e8f0;
      padding: 12px 14px;
      border-radius: 12px;
      font-family: sans-serif;
      font-size: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.45);
      max-height: 250px;
      overflow-y: auto;
    }
    .info-panel h3 { font-size: 13px; color: #38bdf8; margin-bottom: 4px; }
    
    .spot-card {
      background: #0f172a;
      border-radius: 8px;
      padding: 9px 11px;
      margin-top: 6px;
      border-left: 4px solid #22c55e;
    }
    .spot-card-header {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 12px;
      margin-bottom: 4px;
    }
    .reason-box {
      background: #1e293b;
      border-radius: 6px;
      padding: 6px 8px;
      margin-top: 5px;
      font-size: 11px;
      line-height: 1.4;
      color: #cbd5e1;
    }
    .button-group {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .leaflet-popup-content-wrapper {
      background: #0f172a !important;
      color: #f8fafc !important;
      border-radius: 10px;
      border: 1px solid #334155;
    }
    .leaflet-popup-tip { background: #0f172a !important; }
    .popup-title { font-weight: 700; font-size: 13px; color: #38bdf8; margin-bottom: 4px; }
    .popup-reason {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #334155;
      font-size: 11px;
      line-height: 1.4;
      color: #e2e8f0;
    }
  </style>
</head>
<body>

  <div class="top-panel">
    <div class="top-header">
      <div class="title-group">
        <h1>Kystfangst</h1>
        <span class="version-tag">v1.2.0</span>
      </div>
      <button id="installBtn" onclick="installerPwa()">Installer app</button>
    </div>

    <div class="selectors-grid">
      <div class="select-item">
        <label>Metode</label>
        <select id="metodeSelect" onchange="oppdaterArter(); startOmraadeSkanning();">
          <option value="teine">🦀 Teine</option>
          <option value="garn">🕸️ Garn</option>
          <option value="stang">🎣 Stangfiske</option>
        </select>
      </div>

      <div class="select-item">
        <label>Art</label>
        <select id="artSelect" onchange="startOmraadeSkanning();">
          <!-- Fylles dynamisk -->
        </select>
      </div>

      <div class="select-item">
        <label>Posisjon</label>
        <select id="posisjonSelect" onchange="startOmraadeSkanning();">
          <option value="land">Fra land (5m kast)</option>
          <option value="baat">I båt</option>
        </select>
      </div>

      <div class="select-item">
        <label>Søkeradius</label>
        <select id="radiusSelect" onchange="oppdaterRadiusVisuelt(); startOmraadeSkanning();">
          <option value="500">500 m</option>
          <option value="1500" selected>1.5 km</option>
          <option value="3000">3.0 km</option>
          <option value="5000">5.0 km</option>
        </select>
      </div>

      <div class="select-item" style="grid-column: span 2;">
        <label>Antall viste forslag</label>
        <div class="stepper-container">
          <button class="step-btn" onclick="endreAntallPunkter(-1)">−</button>
          <span class="step-val" id="punktTeller">3 punkter</span>
          <button class="step-btn" onclick="endreAntallPunkter(1)">+</button>
        </div>
      </div>
    </div>

    <div class="action-row">
      <button class="btn" onclick="finnMinPosisjon()">Bruk GPS</button>
      <button class="btn btn-secondary" onclick="toggleKartlag()">Kartlag (Bunn/Fredet)</button>
    </div>
  </div>

  <div class="info-panel" id="infoPanel">
    <h3>Ekte Kystanalyse</h3>
    Trykk i kartet for å søke. <em>Hold fingeren nede i kartet</em> for å droppe din egen markør.
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ----------------------------------------------------------------
    // 1. PWA & Service Worker
    // ----------------------------------------------------------------
    let refreshing = false;
    navigator.serviceWorker?.addEventListener('controllerchange', () => {
      if (!refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(r => r.update()).catch(console.warn);
      });
    }

    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'inline-block';
    });

    function installerPwa() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => { installBtn.style.display = 'none'; });
    }

    // ----------------------------------------------------------------
    // 2. Artsliste per metode
    // ----------------------------------------------------------------
    const ARTS_OPPLEGG = {
      teine: ["Alle arter / Generelt", "Hummer", "Taskekrabbe"],
      garn: ["Alle arter / Generelt", "Torsk / Sei", "Flyndre / Flatfisk"],
      stang: ["Alle arter / Generelt", "Sjøørret", "Torsk / Sei / Lyr"]
    };

    function oppdaterArter() {
      const metode = document.getElementById('metodeSelect').value;
      const artSelect = document.getElementById('artSelect');
      artSelect.innerHTML = '';
      (ARTS_OPPLEGG[metode] || []).forEach(art => {
        const opt = document.createElement('option');
        opt.value = art;
        opt.textContent = art;
        artSelect.appendChild(opt);
      });
    }
    oppdaterArter();

    // ----------------------------------------------------------------
    // 3. Kartoppsett
    // ----------------------------------------------------------------
    const map = L.map('map', { 
      zoomControl: false, 
      maxZoom: 18, 
      minZoom: 5
    }).setView([62.37, 6.0], 13);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution: '© Esri, Kartverket',
      maxZoom: 18
    }).addTo(map);

    L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);

    const sjokart = L.tileLayer.wms('https://opencache.statkart.no/gatekeeper/gk/gk.open?', {
      layers: 'sjokartraster',
      format: 'image/png',
      transparent: true,
      opacity: 0.85
    }).addTo(map);

    const bunnlag = L.tileLayer.wms('https://geo.ngu.no/geoserver/marin_sedimentkornstorrelse/wms?', {
      layers: 'Sedimentkornstorrelse_omrade',
      format: 'image/png',
      transparent: true,
      opacity: 0.45
    }).addTo(map);

    const fredningslag = L.tileLayer.wms('https://kart.fiskeridir.no/wms.aspx?', {
      layers: 'hummerreservat',
      format: 'image/png',
      transparent: true,
      opacity: 0.65
    }).addTo(map);

    let visLag = true;
    function toggleKartlag() {
      visLag = !visLag;
      if (visLag) {
        map.addLayer(bunnlag);
        map.addLayer(fredningslag);
      } else {
        map.removeLayer(bunnlag);
        map.removeLayer(fredningslag);
      }
    }

    function kopierKoordinater(lat, lng) {
      const coordStr = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
      navigator.clipboard.writeText(coordStr).then(() => {
        alert("Kopierte koordinater:\n" + coordStr);
      }).catch(() => {
        prompt("Kopier herfra:", coordStr);
      });
    }

    function faaNavigasjonsUrl(lat, lng) {
      return `https://www.google.com/maps/dir/?api=1&destination=${lat.toFixed(6)},${lng.toFixed(6)}`;
    }

    // ----------------------------------------------------------------
    // 4. Feilfri hold-inne via Leaflet contextmenu
    // ----------------------------------------------------------------
    let manuellPin = null;

    map.on('contextmenu', function(e) {
      droppEgenPin(e.latlng);
    });

    async function droppEgenPin(latlng) {
      if (manuellPin) map.removeLayer(manuellPin);

      const lillaIkon = L.divIcon({
        className: 'custom-pin',
        html: `<div style="background:#8b5cf6; color:white; border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:18px; border:2px solid white; box-shadow:0 3px 10px rgba(0,0,0,0.6);">📍</div>`,
        iconSize: [32, 32]
      });

      manuellPin = L.marker(latlng, { icon: lillaIkon }).addTo(map);
      const navUrl = faaNavigasjonsUrl(latlng.lat, latlng.lng);

      manuellPin.bindPopup(`
        <div class="popup-title">📍 Egendroppet markør</div>
        <div><strong>Koordinater:</strong> ${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}</div>
        <div class="button-group">
          <a class="btn-nav" href="${navUrl}" target="_blank">🗺️ Naviger</a>
          <button class="btn-copy" onclick="kopierKoordinater(${latlng.lat}, ${latlng.lng})">📋 Kopier</button>
        </div>
      `).openPopup();

      document.getElementById('infoPanel').innerHTML = `
        <div class="spot-card" style="border-left-color:#8b5cf6;">
          <div class="spot-card-header">
            <span>📍 Egendroppet markør</span>
            <span style="color:#a78bfa;">VALGT PUNKT</span>
          </div>
          <div><strong>Koordinater:</strong> ${latlng.lat.toFixed(6)}, ${latlng.lng.toFixed(6)}</div>
          <div class="button-group">
            <a class="btn-nav" href="${navUrl}" target="_blank">🗺️ Naviger med Google Maps</a>
            <button class="btn-copy" onclick="kopierKoordinater(${latlng.lat}, ${latlng.lng})">📋 Kopier koordinater</button>
          </div>
        </div>
      `;
    }

    // ----------------------------------------------------------------
    // 5. Stepper (+ / -)
    // ----------------------------------------------------------------
    let onsketAntallPunkter = 3;
    function endreAntallPunkter(delta) {
      const nyttAntall = onsketAntallPunkter + delta;
      if (nyttAntall >= 1 && nyttAntall <= 8) {
        onsketAntallPunkter = nyttAntall;
        document.getElementById('punktTeller').textContent = `${onsketAntallPunkter} punkt${onsketAntallPunkter > 1 ? 'er' : ''}`;
        tegnGjeldendePunkterOgSoner();
      }
    }

    // ----------------------------------------------------------------
    // 6. Backend-analyse via Cloudflare Worker
    // ----------------------------------------------------------------
    const API_ENDPOINT = 'https://kystfangst-api.danielodland.workers.dev';

    let senterPosisjon = null;
    let radiusSirkel = null;
    let senterMarkor = null;
    let soneLag = [];
    let funnMarkorer = [];
    let kastesirkler = [];
    let analyseresultater = [];

    map.on('click', function(e) {
      settSenterOgSkann(e.latlng);
    });

    function finnMinPosisjon() {
      if (!navigator.geolocation) {
        alert("Geolokasjon støttes ikke.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const latlng = L.latLng(pos.coords.latitude, pos.coords.longitude);
          map.setView(latlng, 15);
          settSenterOgSkann(latlng);
        },
        (err) => alert("Kunne ikke hente posisjon: " + err.message),
        { enableHighAccuracy: true }
      );
    }

    function settSenterOgSkann(latlng) {
      senterPosisjon = latlng;
      if (senterMarkor) map.removeLayer(senterMarkor);
      
      senterMarkor = L.circleMarker(latlng, {
        radius: 7,
        color: '#38bdf8',
        fillColor: '#0284c7',
        fillOpacity: 1,
        weight: 2
      }).addTo(map);

      oppdaterRadiusVisuelt();
      startOmraadeSkanning();
    }

    function oppdaterRadiusVisuelt() {
      if (!senterPosisjon) return;
      const radius = parseInt(document.getElementById('radiusSelect').value);
      if (radiusSirkel) map.removeLayer(radiusSirkel);
      radiusSirkel = L.circle(senterPosisjon, {
        radius: radius,
        color: '#38bdf8',
        fillColor: '#38bdf8',
        fillOpacity: 0.06,
        weight: 1.5,
        dashArray: '5, 5'
      }).addTo(map);
    }

    async function startOmraadeSkanning() {
      if (!senterPosisjon) return;

      const metode = document.getElementById('metodeSelect').value;
      const posisjon = document.getElementById('posisjonSelect').value;
      const radius = parseInt(document.getElementById('radiusSelect').value);

      document.getElementById('infoPanel').innerHTML = `
        <h3>Gjennomfører kystanalyse...</h3>
        <div>Beregner kystlinje og dybdeforhold via backend (${radius}m)...</div>
      `;

      try {
        const queryUrl = `${API_ENDPOINT}?lat=${senterPosisjon.lat}&lng=${senterPosisjon.lng}&radius=${radius}&metode=${metode}&posisjon=${posisjon}`;
        const res = await fetch(queryUrl);
        const data = await res.json();

        if (data.error || !data.spots || data.spots.length === 0) {
          analyseresultater = [];
          tegnGjeldendePunkterOgSoner();
          document.getElementById('infoPanel').innerHTML = `
            <h3>Ingen kystformasjoner funnet</h3>
            <div>Ingen moloer, kaier eller kystkanter registrert innenfor ${radius}m. Prøv å trykke nærmere land.</div>
          `;
          return;
        }

        analyseresultater = data.spots;
        tegnGjeldendePunkterOgSoner();

      } catch (err) {
        document.getElementById('infoPanel').innerHTML = `
          <h3>Kunne ikke kontakte backend</h3>
          <div>Sjekk nettverkstilkoblingen til Cloudflare Workeren.</div>
        `;
      }
    }

    function tegnGjeldendePunkterOgSoner() {
      soneLag.forEach(s => map.removeLayer(s));
      funnMarkorer.forEach(m => map.removeLayer(m));
      kastesirkler.forEach(c => map.removeLayer(c));
      soneLag = [];
      funnMarkorer = [];
      kastesirkler = [];

      if (analyseresultater.length === 0) return;

      const posisjon = document.getElementById('posisjonSelect').value;
      const synlige = analyseresultater.slice(0, onsketAntallPunkter);

      synlige.forEach((spot, idx) => {
        let farge = '#ef4444';
        if (idx === 0) farge = '#eab308';
        else if (idx === 1) farge = '#94a3b8';
        else if (idx === 2) farge = '#b45309';
        else if (spot.score >= 80) farge = '#22c55e';
        else farge = '#38bdf8';

        const sky = L.circle([spot.lat, spot.lng], {
          radius: posisjon === 'land' ? 45 : 85,
          color: farge,
          fillColor: farge,
          fillOpacity: 0.18,
          weight: 1,
          dashArray: '3, 6'
        }).addTo(map);
        soneLag.push(sky);

        const ikon = L.divIcon({
          className: 'spot-icon',
          html: `<div style="background:${farge}; color:white; border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:12px; border:2px solid white; box-shadow:0 3px 8px rgba(0,0,0,0.6);">${idx+1}</div>`,
          iconSize: [28, 28]
        });

        const m = L.marker([spot.lat, spot.lng], { icon: ikon }).addTo(map);

        if (posisjon === 'land') {
          const sirkel = L.circle([spot.lat, spot.lng], {
            radius: 5,
            color: farge,
            fillColor: farge,
            fillOpacity: 0.35,
            weight: 2
          }).addTo(map);
          kastesirkler.push(sirkel);
        }

        const navUrl = faaNavigasjonsUrl(spot.lat, spot.lng);

        m.bindPopup(`
          <div class="popup-title">Plass #${idx+1}: ${spot.type}</div>
          <div><strong>Kvalitetsscore:</strong> <span style="color:${farge}; font-weight:bold;">${spot.score}%</span></div>
          <div><strong>Bunnforhold:</strong> ${spot.bunn}</div>
          <div class="popup-reason">${spot.begrunnelse}</div>
          <div class="button-group">
            <a class="btn-nav" href="${navUrl}" target="_blank">🗺️ Naviger</a>
            <button class="btn-copy" onclick="kopierKoordinater(${spot.lat}, ${spot.lng})">📋 Kopier</button>
          </div>
        `);

        m.on('click', () => {
          visDetaljertFunn(spot, `Plass #${idx+1}`, farge);
        });

        funnMarkorer.push(m);
      });

      if (synlige.length > 0) {
        visDetaljertFunn(synlige[0], "🥇 Toppforslag (#1)", '#eab308');
      }
    }

    function visDetaljertFunn(spot, tittel, farge) {
      const navUrl = faaNavigasjonsUrl(spot.lat, spot.lng);

      document.getElementById('infoPanel').innerHTML = `
        <div class="spot-card" style="border-left-color:${farge};">
          <div class="spot-card-header">
            <span>${tittel}: ${spot.type}</span>
            <span style="color:#4ade80;">${spot.score}% MATCH</span>
          </div>
          <div><strong>Bunnforhold:</strong> ${spot.bunn}</div>
          <div><strong>Koordinater:</strong> ${spot.lat.toFixed(5)}, ${spot.lng.toFixed(5)}</div>
          <div class="reason-box">${spot.begrunnelse}</div>
          <div class="button-group">
            <a class="btn-nav" href="${navUrl}" target="_blank">🗺️ Naviger med Google Maps</a>
            <button class="btn-copy" onclick="kopierKoordinater(${spot.lat}, ${spot.lng})">📋 Kopier koordinater</button>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
