<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kystfangst v0.9.0</title>

  <!-- PWA Manifest & Farger -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#121826" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦀</text></svg>" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #map { height: 100%; width: 100%; }

    .top-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(18, 24, 38, 0.95);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 12px 14px;
      border-radius: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .title-group { display: flex; align-items: baseline; gap: 6px; }
    .top-header h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
    .version-tag {
      font-size: 10px;
      font-weight: 600;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
    }

    #installBtn {
      display: none;
      background: #16a34a;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .selectors-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }
    .select-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .select-item label {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 600;
      color: #94a3b8;
    }
    select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      width: 100%;
    }

    .stepper-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 2px 6px;
      height: 31px;
    }
    .step-btn {
      background: #334155;
      color: #fff;
      border: none;
      width: 26px;
      height: 24px;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .step-btn:active { background: #475569; }
    .step-val {
      font-size: 12px;
      font-weight: 700;
      color: #38bdf8;
    }

    .action-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 6px;
    }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      text-align: center;
    }
    .btn:active { background: #1d4ed8; }
    .btn-secondary { background: #334155; }

    /* Navigasjon og Handlingsknapper i kort */
    .btn-nav {
      background: #0284c7;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }
    .btn-copy {
      background: #334155;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .info-panel {
      position: absolute;
      bottom: 20px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(18, 24, 38, 0.95);
      backdrop-filter: blur(8px);
      color: #e2e8f0;
      padding: 12px 14px;
      border-radius: 12px;
      font-family: sans-serif;
      font-size: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.45);
      max-height: 250px;
      overflow-y: auto;
    }
    .info-panel h3 { font-size: 13px; color: #38bdf8; margin-bottom: 4px; }
    
    .spot-card {
      background: #0f172a;
      border-radius: 8px;
      padding: 9px 11px;
      margin-top: 6px;
      border-left: 4px solid #22c55e;
    }
    .spot-card-header {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 12px;
      margin-bottom: 4px;
    }
    .reason-box {
      background: #1e293b;
      border-radius: 6px;
      padding: 6px 8px;
      margin-top: 5px;
      font-size: 11px;
      line-height: 1.4;
      color: #cbd5e1;
    }
    .button-group {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .leaflet-popup-content-wrapper {
      background: #0f172a !important;
      color: #f8fafc !important;
      border-radius: 10px;
      border: 1px solid #334155;
    }
    .leaflet-popup-tip { background: #0f172a !important; }
    .popup-title { font-weight: 700; font-size: 13px; color: #38bdf8; margin-bottom: 4px; }
    .popup-reason {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #334155;
      font-size: 11px;
      line-height: 1.4;
      color: #e2e8f0;
    }
  </style>
</head>
<body>

  <div class="top-panel">
    <div class="top-header">
      <div class="title-group">
        <h1>Kystfangst</h1>
        <span class="version-tag">v0.9.0</span>
      </div>
      <button id="installBtn" onclick="installerPwa()">Installer app</button>
    </div>

    <div class="selectors-grid">
      <div class="select-item">
        <label>Metode</label>
        <select id="metodeSelect" onchange="oppdaterArter(); startOmraadeSkanning();">
          <option value="teine">🦀 Teine</option>
          <option value="garn">🕸️ Garn</option>
          <option value="stang">🎣 Stangfiske</option>
        </select>
      </div>

      <div class="select-item">
        <label>Art</label>
        <select id="artSelect" onchange="startOmraadeSkanning();">
          <!-- Fylles dynamisk -->
        </select>
      </div>

      <div class="select-item">
        <label>Posisjon</label>
        <select id="posisjonSelect" onchange="startOmraadeSkanning();">
          <option value="land">Fra land (5m kast)</option>
          <option value="baat">I båt</option>
        </select>
      </div>

      <div class="select-item">
        <label>Søkeradius</label>
        <select id="radiusSelect" onchange="oppdaterRadiusVisuelt(); startOmraadeSkanning();">
          <option value="500">500 m</option>
          <option value="1500" selected>1.5 km</option>
          <option value="3000">3.0 km</option>
          <option value="5000">5.0 km</option>
        </select>
      </div>

      <div class="select-item" style="grid-column: span 2;">
        <label>Antall spesifikke punkter</label>
        <div class="stepper-container">
          <button class="step-btn" onclick="endreAntallPunkter(-1)">−</button>
          <span class="step-val" id="punktTeller">3 punkter</span>
          <button class="step-btn" onclick="endreAntallPunkter(1)">+</button>
        </div>
      </div>
    </div>

    <div class="action-row">
      <button class="btn" onclick="finnMinPosisjon()">Bruk GPS</button>
      <button class="btn btn-secondary" onclick="toggleKartlag()">Kartlag (Bunn/Fredet)</button>
    </div>
  </div>

  <div class="info-panel" id="infoPanel">
    <h3>Områdeskanning & Navigasjon</h3>
    Trykk i kartet for å skanne. <em>Hold inne i 1 sekund</em> for å droppe egen markør hvor som helst.
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ----------------------------------------------------------------
    // 1. PWA & Service Worker
    // ----------------------------------------------------------------
    let refreshing = false;
    navigator.serviceWorker?.addEventListener('controllerchange', () => {
      if (!refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(r => r.update()).catch(console.warn);
      });
    }

    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'inline-block';
    });

    function installerPwa() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => { installBtn.style.display = 'none'; });
    }

    // ----------------------------------------------------------------
    // 2. Biologiske Habitat-Krav
    // ----------------------------------------------------------------
    const ARTS_DATA = {
      teine: {
        generelt: {
          navn: "Alle arter / Generelt",
          dybdeKravLand: "8 - 25 m (bratt fall)",
          dybdeKravBaat: "10 - 45 m",
          foretrukketBunn: ["Stein", "Fjell", "Blokk", "Grov"],
          unngaBunn: ["Slam", "Leire", "Mudder"],
          tips: "Let etter moloer og loddrette svaberg der det blir brådypt med en gang."
        },
        krabbe: {
          navn: "Taskekrabbe",
          dybdeKravLand: "8 - 20 m",
          dybdeKravBaat: "15 - 45 m",
          foretrukketBunn: ["Stein", "Blokk", "Grus", "Fjell"],
          unngaBunn: ["Finkornet leire", "Slam"],
          tips: "Krabben beiter i overgangen mellom stein og sand. Moloer er bankers fra land."
        },
        hummer: {
          navn: "Hummer",
          dybdeKravLand: "5 - 20 m",
          dybdeKravBaat: "8 - 30 m",
          foretrukketBunn: ["Ur", "Fjell", "Blokk", "Stein"],
          unngaBunn: ["Sand", "Slam", "Leire"],
          tips: "Krever store steinblokker eller fjellsprekker for skjul. Må ikke settes i fredningsfelt."
        }
      },
      garn: {
        generelt: {
          navn: "Alle arter / Generelt",
          dybdeKravLand: "10 - 30 m",
          dybdeKravBaat: "15 - 60 m",
          foretrukketBunn: ["Sandlommer", "Blandet bunn"],
          unngaBunn: ["Skarpe fjelldrag"],
          tips: "Sett langs terskler eller overganger der strømmen fører fisk forbi."
        },
        torsk: {
          navn: "Torsk / Sei",
          dybdeKravLand: "10 - 25 m",
          dybdeKravBaat: "20 - 50 m",
          foretrukketBunn: ["Tare", "Hardbunn", "Stein"],
          unngaBunn: ["Dypmudder"],
          tips: "Sund og nes med god strøm gir best uttelling."
        },
        flyndre: {
          navn: "Flyndre / Flatfisk",
          dybdeKravLand: "4 - 15 m",
          dybdeKravBaat: "10 - 35 m",
          foretrukketBunn: ["Sand", "Skjellsand", "Grus"],
          unngaBunn: ["Grov ur", "Fjellbunn"],
          tips: "Søk i bukter og viker med flat og finkornet sandbunn."
        }
      },
      stang: {
        generelt: {
          navn: "Alle arter / Generelt",
          dybdeKravLand: "5 - 35 m",
          dybdeKravBaat: "15 - 80 m",
          foretrukketBunn: ["Marbakke", "Variert bunn"],
          unngaBunn: [],
          tips: "Avsøk flere dybder med sluk og jigg."
        },
        sjoorret: {
          navn: "Sjøørret",
          dybdeKravLand: "1 - 8 m",
          dybdeKravBaat: "2 - 10 m",
          foretrukketBunn: ["Leopardbunn", "Tang", "Sand"],
          unngaBunn: ["Bart fjell"],
          tips: "Kast langs marbakker, viker og odder med tang og sandlommer."
        },
        torsk_sei: {
          navn: "Torsk / Sei / Lyr",
          dybdeKravLand: "10 - 35 m",
          dybdeKravBaat: "25 - 90 m",
          foretrukketBunn: ["Brattsva", "Dypkanter"],
          unngaBunn: ["Langgrunne sandstrender"],
          tips: "Finn loddrette svaberg der du kaster rett ut i dyprenna."
        }
      }
    };

    function oppdaterArter() {
      const metode = document.getElementById('metodeSelect').value;
      const artSelect = document.getElementById('artSelect');
      artSelect.innerHTML = '';

      const arter = ARTS_DATA[metode];
      for (const [key, val] of Object.entries(arter)) {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = val.navn;
        artSelect.appendChild(opt);
      }
    }
    oppdaterArter();

    // ----------------------------------------------------------------
    // 3. Kart & Lag
    // ----------------------------------------------------------------
    const map = L.map('map', { zoomControl: false, maxZoom: 18, minZoom: 5 }).setView([62.37, 6.0], 13);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution: '© Esri, Kartverket',
      maxZoom: 18
    }).addTo(map);

    L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);

    const sjokart = L.tileLayer.wms('https://opencache.statkart.no/gatekeeper/gk/gk.open?', {
      layers: 'sjokartraster',
      format: 'image/png',
      transparent: true,
      opacity: 0.85
    }).addTo(map);

    const bunnlag = L.tileLayer.wms('https://geo.ngu.no/geoserver/marin_sedimentkornstorrelse/wms?', {
      layers: 'Sedimentkornstorrelse_omrade',
      format: 'image/png',
      transparent: true,
      opacity: 0.45
    }).addTo(map);

    const fredningslag = L.tileLayer.wms('https://kart.fiskeridir.no/wms.aspx?', {
      layers: 'hummerreservat',
      format: 'image/png',
      transparent: true,
      opacity: 0.65
    }).addTo(map);

    let visLag = true;
    function toggleKartlag() {
      visLag = !visLag;
      if (visLag) {
        map.addLayer(bunnlag);
        map.addLayer(fredningslag);
      } else {
        map.removeLayer(bunnlag);
        map.removeLayer(fredningslag);
      }
    }

    // ----------------------------------------------------------------
    // 4. Hjelpefunksjoner for Navigasjon og Kopiering
    // ----------------------------------------------------------------
    function kopierKoordinater(lat, lng) {
      const coordStr = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
      navigator.clipboard.writeText(coordStr).then(() => {
        alert("Kopierte koordinater til utklippstavlen:\n" + coordStr);
      }).catch(() => {
        prompt("Kopier koordinatene herfra:", coordStr);
      });
    }

    function faaNavigasjonsUrl(lat, lng) {
      return `https://www.google.com/maps/dir/?api=1&destination=${lat.toFixed(6)},${lng.toFixed(6)}`;
    }

    // ----------------------------------------------------------------
    // 5. Long-press (Hold inne) for å droppe egen pin
    // ----------------------------------------------------------------
    let manuellPin = null;
    let pressTimer = null;

    map.on('mousedown touchstart', function(e) {
      pressTimer = window.setTimeout(async () => {
        const latlng = e.latlng;
        droppEgenPin(latlng);
      }, 650); // 650ms hold-tid for mobil
    });

    map.on('mouseup touchend dragstart zoomstart', function() {
      if (pressTimer) {
        clearTimeout(pressTimer);
        pressTimer = null;
      }
    });

    async function droppEgenPin(latlng) {
      if (manuellPin) map.removeLayer(manuellPin);

      const lillaIkon = L.divIcon({
        className: 'custom-pin',
        html: `<div style="background:#8b5cf6; color:white; border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center; font-size:16px; border:2px solid white; box-shadow:0 3px 10px rgba(0,0,0,0.6);">📍</div>`,
        iconSize: [30, 30]
      });

      manuellPin = L.marker(latlng, { icon: lillaIkon }).addTo(map);

      // Hent sediment og dybdeestimat for punktet
      const bunn = await hentNGUSediment(latlng.lat, latlng.lng) || "Fjell / Hardbunn";
      const navUrl = faaNavigasjonsUrl(latlng.lat, latlng.lng);

      const html = `
        <div class="popup-title">📍 Egendroppet markør</div>
        <div><strong>Koordinater:</strong> ${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}</div>
        <div><strong>Bunnforhold:</strong> ${bunn}</div>
        <div class="button-group">
          <a class="btn-nav" href="${navUrl}" target="_blank">🗺️ Naviger</a>
          <button class="btn-copy" onclick="kopierKoordinater(${latlng.lat}, ${latlng.lng})">📋 Kopier</button>
        </div>
      `;

      manuellPin.bindPopup(html).openPopup();

      document.getElementById('infoPanel').innerHTML = `
        <div class="spot-card" style="border-left-color:#8b5cf6;">
          <div class="spot-card-header">
            <span>📍 Egendroppet markør</span>
            <span style="color:#a78bfa;">EGET PUNKT</span>
          </div>
          <div><strong>Koordinater:</strong> ${latlng.lat.toFixed(6)}, ${latlng.lng.toFixed(6)}</div>
          <div><strong>Registrert bunn:</strong> ${bunn}</div>
          <div class="button-group">
            <a class="btn-nav" href="${navUrl}" target="_blank">🗺️ Naviger med Google Maps</a>
            <button class="btn-copy" onclick="kopierKoordinater(${latlng.lat}, ${latlng.lng})">📋 Kopier koordinater</button>
          </div>
        </div>
      `;
    }

    // ----------------------------------------------------------------
    // 6. Stepper-håndtering (+ / -)
    // ----------------------------------------------------------------
    let onsketAntallPunkter = 3;
    function endreAntallPunkter(delta) {
      const nyttAntall = onsketAntallPunkter + delta;
      if (nyttAntall >= 1 && nyttAntall <= 15) {
        onsketAntallPunkter = nyttAntall;
        document.getElementById('punktTeller').textContent = `${onsketAntallPunkter} punkt${onsketAntallPunkter > 1 ? 'er' : ''}`;
        tegnGjeldendePunkterOgSoner();
      }
    }

    // ----------------------------------------------------------------
    // 7. Områdeskanning med soner og rangerte punkter
    // ----------------------------------------------------------------
    let senterPosisjon = null;
    let radiusSirkel = null;
    let senterMarkor = null;
    
    let soneLag = [];
    let funnMarkorer = [];
    let kastesirkler = [];
    let lagredeEvaluertePunkter = [];

    // Enkelt-klikk for områdeskann (kun hvis man ikke holdt inne)
    map.on('click', function(e) {
      settSenterOgSkann(e.latlng);
    });

    function finnMinPosisjon() {
      if (!navigator.geolocation) {
        alert("Geolokasjon støttes ikke.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const latlng = L.latLng(pos.coords.latitude, pos.coords.longitude);
          map.setView(latlng, 15);
          settSenterOgSkann(latlng);
        },
        (err) => alert("Kunne ikke hente posisjon: " + err.message),
        { enableHighAccuracy: true }
      );
    }

    function settSenterOgSkann(latlng) {
      senterPosisjon = latlng;
      if (senterMarkor) map.removeLayer(senterMarkor);
      
      senterMarkor = L.circleMarker(latlng, {
        radius: 7,
        color: '#38bdf8',
        fillColor: '#0284c7',
        fillOpacity: 1,
        weight: 2
      }).addTo(map).bindPopup("Søkesenter (skanner herfra)");

      oppdaterRadiusVisuelt();
      startOmraadeSkanning();
    }

    function oppdaterRadiusVisuelt() {
      if (!senterPosisjon) return;
      const radius = parseInt(document.getElementById('radiusSelect').value);
      if (radiusSirkel) map.removeLayer(radiusSirkel);
      radiusSirkel = L.circle(senterPosisjon, {
        radius: radius,
        color: '#38bdf8',
        fillColor: '#38bdf8',
        fillOpacity: 0.06,
        weight: 1.5,
        dashArray: '5, 5'
      }).addTo(map);
    }

    async function hentNGUSediment(lat, lng) {
      const bbox = `${lng-0.001},${lat-0.001},${lng+0.001},${lat+0.001}`;
      const url = `https://geo.ngu.no/geoserver/marin_sedimentkornstorrelse/wms?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetFeatureInfo&LAYERS=Sedimentkornstorrelse_omrade&QUERY_LAYERS=Sedimentkornstorrelse_omrade&BBOX=${bbox}&FEATURE_COUNT=1&HEIGHT=101&WIDTH=101&INFO_FORMAT=application/json&SRS=EPSG:4326&X=50&Y=50`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.features && data.features.length > 0) {
          const prop = data.features[0].properties;
          return prop.sediment_kornstorrelse || prop.kornstorrelse || prop.sediment || "Fjell / Blokkmark";
        }
      } catch (e) {}
      return null;
    }

    function byggBegrunnelse(type, bunn, metode, art, posisjon) {
      let tekst = "";

      if (posisjon === 'land') {
        if (type.includes('Molo')) {
          tekst += `<strong>Hvorfor her:</strong> Moloen er bygget av sprengsteinblokker som stuper bratt ned. Dette gir tilstrekkelig dybde rett ved kanten innenfor ditt 5-meters kastehold. `;
        } else if (type.includes('Kai') || type.includes('Brygge')) {
          tekst += `<strong>Hvorfor her:</strong> Dypvannskaier er anlagt der havbunnen er dyp helt inn til landkanten. Du slipper å kaste langt; teina eller snøret kan fires nesten loddrett ned. `;
        } else {
          tekst += `<strong>Hvorfor her:</strong> Bratt kystlinje og nes der marbakken ligger kloss opptil land, slik at teina når dypere vann uten å bli liggende i fjøra. `;
        }
      } else {
        tekst += `<strong>Hvorfor her (i båt):</strong> Punktet ligger ved en markant overgang i terrenget med god avstand til grunt vann, gunstig for å sette redskap trygt. `;
      }

      if (art === 'hummer') {
        tekst += `Bunnforholdet (${bunn}) gir optimale hulrom og sprekker for hummeren å gjemme seg i.`;
      } else if (art === 'krabbe') {
        tekst += `Overgangen mot ${bunn} er en klassisk beiteplass for taskekrabbe på nattestid.`;
      } else if (art === 'sjoorret') {
        tekst += `Vannkanten og marbakken her gir god skjul for byttedyr som sjøørreten jakter på.`;
      } else if (art === 'flyndre') {
        tekst += `Den jevne bunnen (${bunn}) er perfekt for flatfisk som graver seg ned for å jakte.`;
      } else {
        tekst += `Kombinasjonen av strøm og bunntype (${bunn}) tiltrekker seg aktiv fisk og bunndyr.`;
      }

      return tekst;
    }

    async function startOmraadeSkanning() {
      if (!senterPosisjon) return;

      const metode = document.getElementById('metodeSelect').value;
      const art = document.getElementById('artSelect').value;
      const posisjon = document.getElementById('posisjonSelect').value;
      const radiusMeter = parseInt(document.getElementById('radiusSelect').value);
      const profil = ARTS_DATA[metode][art];

      document.getElementById('infoPanel').innerHTML = `
        <h3>Skanner kyst og dybde (${radiusMeter}m)...</h3>
        <div>Beregner habitatsoner og forbereder navigasjon for ${profil.navn}...</div>
      `;

      const dLat = radiusMeter / 111300;
      const dLng = radiusMeter / (111300 * Math.cos(senterPosisjon.lat * Math.PI / 180));
      const s = senterPosisjon.lat - dLat;
      const w = senterPosisjon.lng - dLng;
      const n = senterPosisjon.lat + dLat;
      const e = senterPosisjon.lng + dLng;

      const overpassQuery = `[out:json][timeout:12];
        (
          way["man_made"~"breakwater|pier|quay"](${s},${w},${n},${e});
          node["natural"="cape"](${s},${w},${n},${e});
          way["natural"="coastline"](${s},${w},${n},${e});
        );
        out geom 80;`;

      let kandidatSteder = [];

      try {
        const resp = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: overpassQuery
        });
        const geoData = await resp.json();

        geoData.elements.forEach(el => {
          if (el.type === 'node') {
            kandidatSteder.push({ lat: el.lat, lng: el.lon, type: 'Odde / Marbakke', bonus: 15 });
          } else if (el.geometry && el.geometry.length > 0) {
            const steg = Math.max(1, Math.floor(el.geometry.length / 5));
            for (let i = 0; i < el.geometry.length; i += steg) {
              const pt = el.geometry[i];
              let t = 'Svaberg / Kystkant';
              let bonus = 10;
              if (el.tags?.man_made === 'breakwater') { t = 'Molo (Sprengstein)'; bonus = 28; }
              else if (el.tags?.man_made === 'pier' || el.tags?.man_made === 'quay') { t = 'Dypvannskai / Brygge'; bonus = 25; }
              kandidatSteder.push({ lat: pt.lat, lng: pt.lon, type: t, bonus: bonus });
            }
          }
        });
      } catch (err) {
        console.warn("Overpass fallback", err);
      }

      if (kandidatSteder.length === 0) {
        for (let angle = 15; angle < 360; angle += 30) {
          const dist = radiusMeter * 0.5;
          const rad = (angle * Math.PI) / 180;
          const pLat = senterPosisjon.lat + ((dist / 111300) * Math.cos(rad));
          const pLng = senterPosisjon.lng + ((dist / (111300 * Math.cos(senterPosisjon.lat * Math.PI / 180))) * Math.sin(rad));
          kandidatSteder.push({ lat: pLat, lng: pLng, type: 'Kystpunkt', bonus: 5 });
        }
      }

      kandidatSteder = kandidatSteder.filter(k => {
        return senterPosisjon.distanceTo(L.latLng(k.lat, k.lng)) <= radiusMeter;
      });

      lagredeEvaluertePunkter = [];
      const maksAaAnalysere = Math.min(kandidatSteder.length, 30);

      for (let i = 0; i < maksAaAnalysere; i++) {
        const k = kandidatSteder[i];
        let pLat = k.lat;
        let pLng = k.lng;

        if (posisjon === 'baat') {
          pLng += 0.002;
        }

        const bunn = await hentNGUSediment(pLat, pLng) || (k.type.includes('Molo') ? 'Grov stein / Blokk' : 'Fjell / Ur');

        let matchScore = 55 + k.bonus;

        if (profil.foretrukketBunn.some(b => bunn.toLowerCase().includes(b.toLowerCase()))) {
          matchScore += 25;
        }
        if (profil.unngaBunn.some(b => bunn.toLowerCase().includes(b.toLowerCase()))) {
          matchScore -= 35;
        }

        if (posisjon === 'land' && metode === 'teine') {
          if (k.type.includes('Molo') || k.type.includes('Kai')) matchScore += 15;
        }

        const begrunnelse = byggBegrunnelse(k.type, bunn, metode, art, posisjon);

        lagredeEvaluertePunkter.push({
          lat: pLat,
          lng: pLng,
          type: k.type,
          bunn: bunn,
          dybde: posisjon === 'land' ? profil.dybdeKravLand : profil.dybdeKravBaat,
          score: Math.min(Math.max(matchScore, 40), 98),
          begrunnelse: begrunnelse
        });
      }

      lagredeEvaluertePunkter.sort((a, b) => b.score - a.score);
      tegnGjeldendePunkterOgSoner();
    }

    function tegnGjeldendePunkterOgSoner() {
      soneLag.forEach(s => map.removeLayer(s));
      funnMarkorer.forEach(m => map.removeLayer(m));
      kastesirkler.forEach(c => map.removeLayer(c));
      soneLag = [];
      funnMarkorer = [];
      kastesirkler = [];

      if (lagredeEvaluertePunkter.length === 0) return;

      const metode = document.getElementById('metodeSelect').value;
      const art = document.getElementById('artSelect').value;
      const posisjon = document.getElementById('posisjonSelect').value;
      const profil = ARTS_DATA[metode][art];

      lagredeEvaluertePunkter.forEach(spot => {
        if (spot.score >= 65) {
          const erToppSone = spot.score >= 80;
          const soneFarge = erToppSone ? '#22c55e' : '#06b6d4';
          const radiusMeter = posisjon === 'land' ? 45 : 85;

          const skySone = L.circle([spot.lat, spot.lng], {
            radius: radiusMeter,
            color: soneFarge,
            fillColor: soneFarge,
            fillOpacity: erToppSone ? 0.22 : 0.12,
            weight: 1,
            dashArray: '3, 6'
          }).addTo(map);

          skySone.bindPopup(`
            <strong>${erToppSone ? '🌟 Meget god sone' : '👍 God sone'}: ${spot.type}</strong><br>
            Bunn: ${spot.bunn}<br>
            <em>Gunstig kystformasjon for ${profil.navn}.</em>
          `);
          soneLag.push(skySone);
        }
      });

      const synligePunkter = lagredeEvaluertePunkter.slice(0, onsketAntallPunkter);

      synligePunkter.forEach((spot, idx) => {
        let farge = '#ef4444';
        if (idx === 0) farge = '#eab308';
        else if (idx === 1) farge = '#94a3b8';
        else if (idx === 2) farge = '#b45309';
        else if (spot.score >= 80) farge = '#22c55e';
        else farge = '#38bdf8';

        const ikon = L.divIcon({
          className: 'spot-icon',
          html: `<div style="background:${farge}; color:white; border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:12px; border:2px solid white; box-shadow:0 3px 8px rgba(0,0,0,0.6);">${idx+1}</div>`,
          iconSize: [28, 28]
        });

        const m = L.marker([spot.lat, spot.lng], { icon: ikon }).addTo(map);

        if (posisjon === 'land' && metode === 'teine') {
          const sirkel = L.circle([spot.lat, spot.lng], {
            radius: 5,
            color: farge,
            fillColor: farge,
            fillOpacity: 0.35,
            weight: 2
          }).addTo(map);
          kastesirkler.push(sirkel);
        }

        const navUrl = faaNavigasjonsUrl(spot.lat, spot.lng);

        m.bindPopup(`
          <div class="popup-title">Plass #${idx+1}: ${spot.type}</div>
          <div><strong>Kvalitetsscore:</strong> <span style="color:${farge}; font-weight:bold;">${spot.score}%</span></div>
          <div><strong>Bunn:</strong> ${spot.bunn} | <strong>Dybde:</strong> ${spot.dybde}</div>
          <div class="popup-reason">${spot.begrunnelse}</div>
          <div class="button-group">
            <a class="btn-nav" href="${navUrl}" target="_blank">🗺️ Naviger</a>
            <button class="btn-copy" onclick="kopierKoordinater(${spot.lat}, ${spot.lng})">📋 Kopier</button>
          </div>
          ${posisjon === 'land' ? '<div style="margin-top:6px; font-size:10px; color:#94a3b8;">Sirkel = 5m kasterekkevidde.</div>' : ''}
        `);

        m.on('click', () => {
          visDetaljertFunn(spot, `Plass #${idx+1}`, farge);
        });

        funnMarkorer.push(m);
      });

      if (synligePunkter.length > 0) {
        visDetaljertFunn(synligePunkter[0], "🥇 Toppforslag (#1)", '#eab308');
      }
    }

    function visDetaljertFunn(spot, tittel, farge) {
      const navUrl = faaNavigasjonsUrl(spot.lat, spot.lng);

      document.getElementById('infoPanel').innerHTML = `
        <div class="spot-card" style="border-left-color:${farge};">
          <div class="spot-card-header">
            <span>${tittel}: ${spot.type}</span>
            <span style="color:#4ade80;">${spot.score}% MATCH</span>
          </div>
          <div><strong>Bunn:</strong> ${spot.bunn} | <strong>Dybde:</strong> ${spot.dybde}</div>
          <div><strong>Koordinater:</strong> ${spot.lat.toFixed(5)}, ${spot.lng.toFixed(5)}</div>
          <div class="reason-box">${spot.begrunnelse}</div>
          <div class="button-group">
            <a class="btn-nav" href="${navUrl}" target="_blank">🗺️ Naviger med Google Maps</a>
            <button class="btn-copy" onclick="kopierKoordinater(${spot.lat}, ${spot.lng})">📋 Kopier koordinater</button>
          </div>
        </div>
      `;
    }
  </script>
</body>
